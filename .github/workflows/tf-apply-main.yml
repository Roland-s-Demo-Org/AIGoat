name: 'Terraform Apply'

on:
  workflow_dispatch:

permissions: write-all

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set Account ID
      id: account
      run: |
        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

    - name: Create S3 bucket for Terraform state with security controls
      run: |
        BUCKET_NAME="aigoat-state-files-${{ steps.account.outputs.ACCOUNT_ID }}"
        if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Creating S3 bucket: $BUCKET_NAME"
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region $AWS_REGION
          
          # Enable versioning for state file integrity and rollback capability
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled
          
          # Enable server-side encryption
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }]
            }'
          
          # Block public access
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          
          # Enable bucket ownership controls
          aws s3api put-bucket-ownership-controls \
            --bucket "$BUCKET_NAME" \
            --ownership-controls Rules=[{ObjectOwnership=BucketOwnerEnforced}]
          
          echo "S3 bucket created with versioning, encryption, and access controls"
        else
          echo "S3 bucket already exists: $BUCKET_NAME"
          
          # Ensure versioning is enabled on existing bucket
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled
        fi

    - name: Create DynamoDB table for state locking
      run: |
        TABLE_NAME="aigoat-terraform-locks"
        if ! aws dynamodb describe-table --table-name "$TABLE_NAME" 2>/dev/null; then
          echo "Creating DynamoDB table for state locking: $TABLE_NAME"
          aws dynamodb create-table \
            --table-name "$TABLE_NAME" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region $AWS_REGION
          
          # Wait for table to be active
          aws dynamodb wait table-exists --table-name "$TABLE_NAME"
          echo "DynamoDB table created successfully"
        else
          echo "DynamoDB table already exists: $TABLE_NAME"
        fi

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: 3

    - name: Install boto3
      run: pip install boto3

    - name: Terraform Operations
      run: |
        set -e  # Exit immediately if a command exits with a non-zero status
        
        BUCKET_NAME="aigoat-state-files-${{ steps.account.outputs.ACCOUNT_ID }}"
        TABLE_NAME="aigoat-terraform-locks"
        
        # Terraform Init with S3 backend configuration
        # This enables state locking, versioning, and integrity checks
        terraform init \
          -backend-config="bucket=$BUCKET_NAME" \
          -backend-config="dynamodb_table=$TABLE_NAME"
        
        # Terraform Plan
        terraform plan -input=false
        
        # Terraform Apply
        terraform apply -auto-approve -input=false
        
    - name: Display Terraform Outputs
      id: tf_output
      run: |
        BUCKET_URL=$(terraform output -raw bucket_url || echo "No bucket_url output")
        BACKEND_IP=$(terraform output -raw backend_ip || echo "No backend_ip output")
        echo "Bucket URL: $BUCKET_URL"
        echo "Backend IP (For viewing hints): $BACKEND_IP"
