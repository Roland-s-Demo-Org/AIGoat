name: 'Terraform Apply'

on:
  workflow_dispatch:

permissions: write-all

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set Account ID
      id: account
      run: |
        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

    - name: Create S3 bucket for Terraform state
      run: |
        BUCKET_NAME="aigoat-state-files-${{ steps.account.outputs.ACCOUNT_ID }}"
        ACCOUNT_ID="${{ steps.account.outputs.ACCOUNT_ID }}"
        BUCKET_EXISTS=false
        BUCKET_OWNED=false
        
        # Check if bucket exists
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          BUCKET_EXISTS=true
          echo "Bucket exists, verifying ownership..."
          
          # Verify bucket ownership by checking if we can get bucket location (requires ownership or explicit permission)
          # and comparing the bucket's owner account ID with our account ID
          if BUCKET_LOCATION=$(aws s3api get-bucket-location --bucket "$BUCKET_NAME" 2>/dev/null); then
            # Try to get bucket ACL which requires ownership or explicit permission
            if BUCKET_ACL=$(aws s3api get-bucket-acl --bucket "$BUCKET_NAME" 2>/dev/null); then
              # Extract owner ID from ACL and verify it matches our account
              BUCKET_OWNER=$(echo "$BUCKET_ACL" | jq -r '.Owner.ID // empty')
              # Get our canonical user ID
              OUR_CANONICAL_ID=$(aws s3api list-buckets --query 'Owner.ID' --output text)
              
              if [ "$BUCKET_OWNER" = "$OUR_CANONICAL_ID" ]; then
                BUCKET_OWNED=true
                echo "Bucket ownership verified successfully"
              else
                echo "ERROR: Bucket exists but is owned by a different AWS account!"
                echo "This could be a security issue - the bucket may have been pre-claimed by an attacker."
                exit 1
              fi
            else
              echo "ERROR: Cannot retrieve bucket ACL. Bucket may be owned by another account."
              exit 1
            fi
          else
            echo "ERROR: Cannot retrieve bucket location. Bucket may be owned by another account."
            exit 1
          fi
        fi
        
        # Create bucket if it doesn't exist or isn't owned by us
        if [ "$BUCKET_EXISTS" = false ] || [ "$BUCKET_OWNED" = false ]; then
          echo "Creating S3 bucket: $BUCKET_NAME"
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region $AWS_REGION
          
          # Apply security best practices
          echo "Applying security controls to bucket..."
          
          # Enable versioning
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled
          
          # Enable default encryption
          aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }]
            }'
          
          # Block all public access
          aws s3api put-public-access-block --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          
          echo "Security controls applied successfully"
        fi

    - name: Check for existing state file
      id: check_state
      run: |
        BUCKET_NAME="aigoat-state-files-${{ steps.account.outputs.ACCOUNT_ID }}"
        
        # Verify bucket ownership before checking for state file
        echo "Verifying bucket ownership before state file operations..."
        if ! BUCKET_ACL=$(aws s3api get-bucket-acl --bucket "$BUCKET_NAME" 2>/dev/null); then
          echo "ERROR: Cannot retrieve bucket ACL. Bucket may be owned by another account."
          exit 1
        fi
        
        BUCKET_OWNER=$(echo "$BUCKET_ACL" | jq -r '.Owner.ID // empty')
        OUR_CANONICAL_ID=$(aws s3api list-buckets --query 'Owner.ID' --output text)
        
        if [ "$BUCKET_OWNER" != "$OUR_CANONICAL_ID" ]; then
          echo "ERROR: Bucket is owned by a different AWS account!"
          exit 1
        fi
        
        # Now check for state file
        if aws s3api head-object --bucket "$BUCKET_NAME" --key terraform.tfstate 2>/dev/null; then
          echo "State file exists. Will use existing state."
          echo "STATE_EXISTS=true" >> $GITHUB_OUTPUT
        else
          echo "No state file found. Will create new deployment."
          echo "STATE_EXISTS=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: 3

    - name: Install boto3
      run: pip install boto3

    - name: Terraform Operations
      run: |
        set -e  # Exit immediately if a command exits with a non-zero status
        
        # Retrieve existing state if it exists
        if [[ "${{ steps.check_state.outputs.STATE_EXISTS }}" == "true" ]]; then
          aws s3 cp s3://aigoat-state-files-${{ steps.account.outputs.ACCOUNT_ID }}/terraform.tfstate ./terraform.tfstate || true
        fi
        
        # Terraform Init
        terraform init
        
        # Terraform Plan
        terraform plan -input=false
        
        # Terraform Apply
        terraform apply -auto-approve -input=false
        
    - name: Display Terraform Outputs
      id: tf_output
      run: |
        BUCKET_URL=$(terraform output -raw bucket_url || echo "No bucket_url output")
        BACKEND_IP=$(terraform output -raw backend_ip || echo "No backend_ip output")
        echo "Bucket URL: $BUCKET_URL"
        echo "Backend IP (For viewing hints): $BACKEND_IP"

    - name: Copy state file to S3
      if: always()
      run: |
        aws s3 cp ./terraform.tfstate s3://aigoat-state-files-${{ steps.account.outputs.ACCOUNT_ID }}/terraform.tfstate
